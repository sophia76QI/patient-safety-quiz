<title>이명이 아명이 환자안전 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --mist:#DCEBD8; --line:#C4D6C2; --ink:#24382C; --sub:#5F7264;
    --green:#3E8A68; --green-deep:#2C6B4E; --gold:#E9A62E;
    --blue-soft:#CFE4F7; --pink-soft:#F8D9E6;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    min-height:100dvh; padding:0 16px; padding-block:28px;
    background:linear-gradient(180deg,#DCEBD8,#EFE8D2 60%);
    color:var(--ink); font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:grid; place-items:center;
  }
  .card{
    width:min(92vw,420px); background:#fff; border-radius:26px; text-align:center;
    box-shadow:0 12px 34px rgba(44,107,78,.16); padding:30px 24px;
  }
  img.ch{width:130px; height:130px; border-radius:50%; border:5px solid #fff;
    box-shadow:0 8px 22px rgba(44,107,78,.2)}
  h1{font-family:'Jua'; font-weight:400; font-size:27px; color:var(--green-deep); margin-top:12px; line-height:1.3}
  .sub{font-size:13px; letter-spacing:.12em; color:var(--sub); margin-top:6px}
  .chips{display:flex; gap:8px; justify-content:center; margin-top:12px}
  .chip{font-size:13px; padding:5px 12px; border-radius:999px}
  .chip.b{background:var(--blue-soft); color:#275A88}
  .chip.p{background:var(--pink-soft); color:#A03D66}
  a.btn{
    display:flex; align-items:center; gap:14px; text-align:left; text-decoration:none;
    margin-top:14px; padding:16px 18px; border-radius:18px; color:#fff;
    font-family:'Jua'; font-size:18px; transition:transform .12s;
  }
  a.btn:active{transform:scale(.97)}
  a.btn small{display:block; font-family:'Gowun Dodum'; font-size:12.5px; opacity:.92; margin-top:3px}
  a.b1{background:var(--green); box-shadow:0 8px 20px rgba(62,138,104,.35)}
  a.b2{background:var(--gold); color:#4A3308; box-shadow:0 8px 20px rgba(233,166,46,.4)}
  a .ico{font-size:28px}
  .together{margin-top:18px; background:var(--mist); border-radius:14px; padding:12px 14px;
    font-size:12.5px; line-height:1.7; color:var(--green-deep)}
</style>
</head>
